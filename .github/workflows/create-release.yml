name: Create Release API

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target repository owner/name
        required: true
        type: string
      tag_name:
        description: Release tag
        required: true
        type: string
      name:
        description: Release name
        required: false
        type: string
      body:
        description: Release notes
        required: false
        type: string
      prerelease:
        description: Mark as prerelease
        required: false
        default: false
        type: boolean
      draft:
        description: Create as draft
        required: false
        default: false
        type: boolean
      generate_release_notes:
        description: Generate release notes
        required: false
        default: true
        type: boolean

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.name }}
          RELEASE_BODY: ${{ inputs.body }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
          GENERATE_NOTES: ${{ inputs.generate_release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            --argjson prerelease "$PRERELEASE" \
            --argjson draft "$DRAFT" \
            --argjson notes "$GENERATE_NOTES" \
            '{tag_name:$tag, name:$name, body:$body, prerelease:$prerelease, draft:$draft, generate_release_notes:$notes}')

          response=$(curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$TARGET_REPO/releases" \
            -d "$payload")

          echo "$response" | jq '{id, tag_name, name, html_url, draft, prerelease}'
